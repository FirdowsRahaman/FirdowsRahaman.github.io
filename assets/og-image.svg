<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="50%" stop-color="#11141b" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="accentGlow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2a5bd7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2a5bd7" stop-opacity="0" />
    </radialGradient>

    <!-- Subdued Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#accentGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" rx="8"/>

  <!-- Top Header / Monogram -->
  <g transform="translate(80, 80)">
    <!-- Logo Monogram -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-1">FR<tspan fill="#3e74ff">.</tspan></text>
    
    <!-- Top Status Badge -->
    <rect x="740" y="4" width="300" height="34" rx="17" fill="#181c25" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <circle cx="760" cy="21" r="4.5" fill="#10b981"/>
    <text x="774" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#a2a8b8" letter-spacing="1">EU AI ACT &amp; GDPR CONFORMITY</text>
  </g>

  <!-- Main Headline & Role -->
  <g transform="translate(80, 200)">
    <!-- Role Eyebrow -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#4d7cff" letter-spacing="2.5">AI / ML LEAD &amp; ENTERPRISE ARCHITECT</text>

    <!-- Main Title -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="600" fill="#ffffff" letter-spacing="-2.5">
      Intelligence for <tspan fill="#4d7cff">real impact.</tspan>
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#8f95a5" letter-spacing="-0.3">
      Autonomous Multi-Agent Systems · Sovereign AI Gateways · Clinical AI
    </text>
  </g>

  <!-- Pill Tags of Competencies -->
  <g transform="translate(80, 420)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="168" height="38" rx="6" fill="#161922" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="84" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd1de" text-anchor="middle">Multi-Agent Systems</text>

    <!-- Tag 2 -->
    <rect x="180" y="0" width="180" height="38" rx="6" fill="#161922" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="270" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd1de" text-anchor="middle">Sovereign AI Gateway</text>

    <!-- Tag 3 -->
    <rect x="372" y="0" width="144" height="38" rx="6" fill="#161922" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="444" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd1de" text-anchor="middle">FastAPI &amp; vLLM</text>

    <!-- Tag 4 -->
    <rect x="528" y="0" width="188" height="38" rx="6" fill="#161922" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="622" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd1de" text-anchor="middle">EU AI Act (Arts. 10–15)</text>

    <!-- Tag 5 -->
    <rect x="728" y="0" width="160" height="38" rx="6" fill="#161922" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="808" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd1de" text-anchor="middle">Clinical PyTorch AI</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#666d7c" letter-spacing="0.5">firdowsrahaman.github.io</text>
    <text x="1040" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#666d7c" text-anchor="end" letter-spacing="0.5">Enterprise Architecture &amp; Delivery</text>
  </g>
</svg>